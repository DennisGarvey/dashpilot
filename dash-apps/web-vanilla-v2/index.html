<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("fonts/inter-300.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/inter-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("fonts/inter-500.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("fonts/inter-600.ttf") format("truetype");
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <title>Dashpilot Vanilla v2</title>
    <style>
      html,
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none; /* no iOS long-press menu */
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #b8bcc0;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #111;
      }

      body.dark-mode {
        background: #000;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }

      /* Light haze behind the HUD so dark text reads over the sky and road */
      #hudScrim {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        /* left side, so the speed and gear read cleanly */
        background:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.55),
            rgba(255, 255, 255, 0) 32%
          );
        transition: opacity 1s ease;
      }

      body.dark-mode #hudScrim {
        background:
          linear-gradient(to right, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0) 32%),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0) 30%);
      }

      /* Soft patch behind the turn-signal arrows at the top center. It fades out as a traffic light
         gets close, so the light (which sits in the same spot) comes in front of it */
      #blinkerFog {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 280px 110px at 50% 47px,
          rgba(255, 255, 255, 0.97),
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transition: opacity 0.4s linear;
      }

      body.dark-mode #blinkerFog {
        background: radial-gradient(
          ellipse 240px 95px at 50% 47px,
          rgba(0, 0, 0, 0.85),
          rgba(0, 0, 0, 0.5) 45%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      [hidden] {
        display: none !important;
      }

      #sceneStatus {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 3;
        font-size: 16px;
        color: #555;
        pointer-events: none;
      }

      /* Vehicle picker, opened with a long press anywhere */
      #carPicker {
        position: fixed;
        inset: 0;
        z-index: 4000;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.25);
      }

      .picker-card {
        background: #fff;
        color: #111;
        border-radius: 16px;
        padding: 18px 20px 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 260px;
      }

      .picker-title {
        font-size: 14px;
        font-weight: 500;
        color: #777;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #carOptions {
        display: grid;
        grid-template-columns: 1fr 1fr; /* legacy cars on the first row, 2025 cars on the second */
        gap: 10px;
      }

      #carOptions button {
        font:
          500 18px "Inter",
          system-ui,
          sans-serif;
        padding: 14px 22px;
        border-radius: 10px;
        border: 2px solid #ddd;
        background: transparent;
        color: inherit;
        cursor: pointer;
        white-space: nowrap;
      }

      #carOptions button[aria-pressed="true"] {
        border-color: #5cbd68;
        background: #5cbd68;
        color: #fff;
      }

      @media (max-width: 480px) {
        .picker-card {
          max-width: calc(100vw - 32px);
          box-sizing: border-box;
          padding: 16px;
        }

        #carOptions button {
          font-size: 15px;
          padding: 12px 8px;
        }
      }

      body.dark-mode .picker-card {
        background: #1c1c1e;
        color: #f2f2f2;
      }

      body.dark-mode #carOptions button {
        border-color: #3a3a3c;
      }

      body.dark-mode #carOptions button[aria-pressed="true"] {
        border-color: #5cbd68;
      }

      #paintToast {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 6px 18px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        z-index: 3000;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      #speedSignRow {
        position: fixed;
        top: 70px;
        right: 40px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 2000;
      }

      #accSetSpeed {
        font-family: "Inter", sans-serif;
        font-size: 36px;
        font-weight: 400;
        color: #d3d3d3;
        user-select: none;
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      #accMax {
        font-size: 14px;
        color: inherit;
      }

      #speedLimitSign {
        width: 80px;
        height: 80px;
        border: 8px solid red;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        font-family: "Inter", sans-serif;
        color: black;
        font-size: 32px;
        font-weight: 600;
        user-select: none;
        box-sizing: border-box;
      }

      #leftBlindSpot {
        position: fixed;
        top: 0;
        left: 0;
        width: 150px;
        height: 100vh;
        pointer-events: none;
        background: linear-gradient(
          to right,
          rgba(255, 0, 0, 0.5),
          rgba(255, 0, 0, 0)
        );
        z-index: 1000;
        display: none;
      }

      #rightBlindSpot {
        position: fixed;
        top: 0;
        right: 0;
        width: 150px;
        height: 100vh;
        pointer-events: none;
        background: linear-gradient(
          to left,
          rgba(255, 0, 0, 0.5),
          rgba(255, 0, 0, 0)
        );
        z-index: 1000;
        display: none;
      }

      #leftArea {
        position: fixed;
        top: 30px;
        left: 50px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        z-index: 2000;
      }

      #powerBar {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 8px;
        height: 220px;
        margin-top: 50px;
      }

      #powerBarTrack {
        position: relative;
        width: 100%;
        height: 100%;
        background: #eee;
        border-radius: 6px;
        overflow: hidden;
      }

      #powerBarCenter {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: #999;
      }

      #powerBarFill {
        position: absolute;
        left: 0;
        right: 0;
        background: #5cbd68;
        transition:
          top 0.1s ease,
          height 0.1s ease;
      }

      #leftColumn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-top: 20px;
      }

      #speedRow {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      #speedText {
        font-size: 84px;
        font-weight: 300;
        line-height: 1;
      }

      #speedUnit {
        font-size: 18px;
        color: #555;
      }

      #gearText {
        font-size: 18px;
        font-weight: 500;
        padding: 4px 24px;
        border-radius: 6px;
        background: rgb(173, 179, 179);
        color: #fff;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 50px;
        height: 32px;
        box-sizing: border-box;
      }

      #steeringContainer {
        position: relative;
        width: 55px;
        height: 55px;
        margin-top: 12px;
        color: rgb(94, 95, 97);
      }

      #steeringWheel {
        width: 100%;
        height: 100%;
        transition: transform 0.1s linear;
      }

      #blinkerRow {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 2000;
      }

      #leftBlinkerIcon,
      #rightBlinkerIcon {
        width: 34px;
      }

      #warningIcons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #seatbeltIcon {
        width: 32px;
        height: 32px;
        filter: brightness(0) saturate(100%) invert(19%) sepia(97%)
          saturate(7482%) hue-rotate(358deg) brightness(102%) contrast(113%);
        display: none;
      }

      #doorIcon {
        width: 32px;
        height: 32px;
        filter: brightness(0) saturate(100%) invert(19%) sepia(97%)
          saturate(7482%) hue-rotate(358deg) brightness(102%) contrast(113%);
        display: none;
      }

      #driverAlert {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.72);
        color: #ffffff;
        padding: 8px 22px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        z-index: 3000;
        display: none;
      }

      #bottomLeft {
        position: fixed;
        bottom: 30px;
        left: 50px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: "Inter", sans-serif;
        font-size: 16px;
        font-weight: 400;
        color: #333;
        z-index: 2000;
        user-select: none;
      }

      #statusBar {
        position: fixed;
        top: 30px;
        right: 40px;
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 2000;
        user-select: none;
        font-family: "Inter", sans-serif;
        font-size: 13px;
      }

      .battery-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .battery-label {
        font-weight: 500;
        color: #444;
        font-size: 12px;
      }

      .battery-shell {
        position: relative;
        width: 28px;
        height: 14px;
        border: 2px solid #666;
        border-radius: 3px;
        background: transparent;
      }

      .battery-shell::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 50%;
        transform: translateY(-50%);
        width: 2px;
        height: 7px;
        background: #666;
        border-radius: 0 1px 1px 0;
      }

      .battery-fill {
        position: absolute;
        left: 2px;
        top: 2px;
        bottom: 2px;
        width: 0%;
        max-width: calc(100% - 4px);
        border-radius: 1px;
        transition: width 0.3s ease;
      }

      .battery-percent {
        font-weight: 500;
        color: #222;
        font-size: 13px;
      }

      .status-separator {
        width: 1px;
        height: 16px;
        background: #888;
      }

      #batteryTempText {
        font-weight: 400;
        color: #333;
        font-size: 13px;
      }

      /* Dark mode overrides: brighten text so it stands out on the night scene */
      body.dark-mode {
        color: #f2f2f2;
      }

      body.dark-mode #speedText {
        color: #ffffff;
      }

      body.dark-mode #speedUnit,
      body.dark-mode #bottomLeft,
      body.dark-mode .battery-label,
      body.dark-mode #batteryTempText {
        color: #cfcfcf;
      }

      body.dark-mode .battery-percent {
        color: #ffffff;
      }

      body.dark-mode .battery-shell {
        border-color: #bbb;
      }

      body.dark-mode .battery-shell::after {
        background: #bbb;
      }

      body.dark-mode #steeringWheel {
        filter: invert(85%);
      }

      #experimentalIcon {
        position: fixed;
        bottom: 30px;
        right: 40px;
        width: 48px;
        height: 48px;
        z-index: 2000;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hudScrim"></div>
    <div id="blinkerFog"></div>
    <div id="sceneStatus">Loading model…</div>
    <div id="paintToast"></div>
    <div id="carPicker" hidden>
      <div class="picker-card" role="dialog" aria-label="Choose vehicle">
        <div class="picker-title">Vehicle</div>
        <div id="carOptions"></div>
      </div>
    </div>

    <div id="driverAlert"></div>

    <div id="leftBlindSpot"></div>
    <div id="rightBlindSpot"></div>

    <div id="speedSignRow">
      <span id="accSetSpeed">
        <span id="accValue"></span>
        <span id="accMax"></span>
      </span>
      <div id="speedLimitSign">
        <span id="speedLimitText">50</span>
      </div>
    </div>

    <div id="blinkerRow">
      <img id="leftBlinkerIcon" src="left.png" style="opacity: 0" />
      <img id="rightBlinkerIcon" src="right.png" style="opacity: 0" />
    </div>

    <div id="statusBar">
      <div class="battery-group" id="phoneBatteryGroup">
        <span class="battery-label">Phone</span>
        <div class="battery-shell">
          <div
            class="battery-fill"
            id="phoneBatteryFill"
            style="width: 0%; background: #4a90d9"
          ></div>
        </div>
        <span class="battery-percent" id="phoneBatteryPercent"></span>
      </div>
      <div class="status-separator" id="statusSeparator"></div>
      <div class="battery-group" id="carBatteryGroup" style="display: none">
        <span class="battery-label" id="carBatteryLabel">Car</span>
        <div class="battery-shell" id="carBatteryShell">
          <div class="battery-fill" id="carBatteryFill"></div>
        </div>
        <span class="battery-percent" id="carBatteryPercent"></span>
        <span id="batteryTempText"></span>
      </div>
    </div>

    <div id="leftArea">
      <div id="powerBar">
        <div id="powerBarTrack">
          <div id="powerBarCenter"></div>
          <div id="powerBarFill"></div>
        </div>
      </div>
      <div id="leftColumn">
        <div id="warningIcons">
          <img id="seatbeltIcon" src="seat-belt.png" alt="Seatbelt unbuckled" />
          <img id="doorIcon" src="car-door.svg" alt="Door open" />
        </div>

        <div id="speedRow">
          <div id="speedText">0</div>
          <div id="speedUnit">km/h</div>
        </div>

        <div id="gearText">-</div>

        <div id="steeringContainer">
          <img id="steeringWheel" src="steering-wheel.svg" />
        </div>
      </div>
    </div>

    <div id="bottomLeft">
      <div id="odometer"></div>
    </div>

    <img id="experimentalIcon" src="experimental.png" alt="Experimental mode" />

    <script src="scene.js"></script>
    <script>
      window.CarScene = createDashPilotCarScene(document.getElementById("scene"));
    </script>

    <script>
      const leftBlinkerIcon = document.getElementById("leftBlinkerIcon");
      const rightBlinkerIcon = document.getElementById("rightBlinkerIcon");

      function showBlinker(blinkerState, blinkerIcon) {
        if (blinkerState == 2) {
          blinkerIcon.style.opacity = "1";
        } else if (blinkerState == 1) {
          blinkerIcon.style.opacity = "0.3";
        } else {
          blinkerIcon.style.opacity = "0.0";
        }
      }

      function applyBlindSpotBorderEffect(blindSpotState, blindSpotView) {
        blindSpotView.style.display = blindSpotState > 0 ? "block" : "none";
      }

      var receiveMessage = function (car) {
        try {
          document.body.classList.toggle("dark-mode", !!car.darkMode);

          window.CarScene.update(car);

          const angle = car.egoSteeringAngle;
          const speed = parseInt(car.egoSpeed);
          const gear = parseInt(car.gear);
          const leftBlinker = parseInt(car.leftBlinker);
          const rightBlinker = parseInt(car.rightBlinker);
          const speedLimit = parseInt(car.fusedSpeedLimit);

          // Show gears
          const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };
          gearText.textContent = gearMap[gear] || "-";

          showBlinker(leftBlinker, leftBlinkerIcon);
          showBlinker(rightBlinker, rightBlinkerIcon);

          speedText.textContent = speed;
          speedUnit.textContent = car.isImperial ? "mph" : "km/h";

          const isParked = gearMap[gear] == "P";

          if (isParked || speedLimit == 0) {
            speedLimitText.textContent = "";
          } else {
            speedLimitText.textContent = speedLimit;
          }
          document.getElementById("speedSignRow").style.display = isParked
            ? "none"
            : "flex";
          document.getElementById("speedLimitSign").style.visibility =
            speedLimitText.textContent ? "visible" : "hidden";

          const accSet = parseInt(car.accSetSpeed);

          if (!isParked && accSet > 0) {
            accValue.textContent = accSet;
            accMax.textContent = "max";
          } else {
            accValue.textContent = "";
            accMax.textContent = "";
          }

          accSetSpeed.style.color = car.adasOn ? "#5cbd68" : "#d3d3d3";

          applyBlindSpotBorderEffect(car.leftBlindSpot, leftBlindSpot);
          applyBlindSpotBorderEffect(car.rightBlindSpot, rightBlindSpot);

          const buckle = car.buckleStatus;
          seatbeltIcon.style.display =
            buckle != null && buckle == 0 ? "block" : "none";

          // Door open warning
          const door = car.anyDoorOpen;
          doorIcon.style.display = door != null && door > 0 ? "block" : "none";

          // Phone battery
          const phoneBatGroup = document.getElementById("phoneBatteryGroup");
          if (car.showPhoneBattery) {
            const phoneBat = car.phoneBattery;
            if (phoneBat != null && phoneBat >= 0) {
              phoneBatGroup.style.display = "flex";
              document.getElementById("phoneBatteryFill").style.width =
                phoneBat + "%";
              document.getElementById("phoneBatteryPercent").textContent =
                phoneBat + "%";
              if (phoneBat <= 20) {
                document.getElementById("phoneBatteryFill").style.background =
                  "#ff4444";
              } else {
                document.getElementById("phoneBatteryFill").style.background =
                  "#4a90d9";
              }
            }
          } else {
            phoneBatGroup.style.display = "none";
          }

          // Show separator only when both phone and car groups are visible
          document.getElementById("statusSeparator").style.display =
            car.showPhoneBattery && car.showCarBattery ? "block" : "none";

          // Battery SOC + temperature widget
          if (car.showCarBattery) {
            const fullPack = car.fullPackEnergy;
            const remaining = car.nominalEnergyRemaining;
            const buffer = car.energyBuffer;
            const tMin = car.packTMin;
            const tMax = car.packTMax;
            const hasBattery =
              fullPack > 0 && remaining > 0 && fullPack - buffer > 0;
            const hasTemp =
              tMin != null && tMax != null && (tMin > 0 || tMax > 0);

            if (hasBattery || hasTemp) {
              document.getElementById("carBatteryGroup").style.display = "flex";
            }
            if (hasBattery) {
              const soc = Math.round(
                ((remaining - buffer) / (fullPack - buffer)) * 100,
              );
              const clampedSoc = Math.max(0, Math.min(100, soc));
              document.getElementById("carBatteryFill").style.width =
                clampedSoc + "%";
              document.getElementById("carBatteryPercent").textContent =
                soc + "%";
              if (clampedSoc <= 20) {
                document.getElementById("carBatteryFill").style.background =
                  "#ff4444";
              } else {
                document.getElementById("carBatteryFill").style.background =
                  "#5cbd68";
              }
            }
            if (hasTemp) {
              const avgTemp = (tMin + tMax) / 2;
              document.getElementById("batteryTempText").textContent =
                avgTemp.toFixed(0) + (car.isImperial ? "°F" : "°C");
            }
          } else {
            document.getElementById("carBatteryGroup").style.display = "none";
          }

          // Power bar
          const powerLevel = car.powerLevel;
          if (
            powerLevel != null &&
            car.maxDischargePower > 0 &&
            car.maxRegenPower > 0
          ) {
            document.getElementById("powerBar").style.display = "flex";
            const fill = document.getElementById("powerBarFill");
            const pct = Math.abs(powerLevel) / 2;
            if (powerLevel >= 0) {
              // Discharging — bar goes up from center
              fill.style.top = 50 - pct + "%";
              fill.style.height = pct + "%";
              fill.style.background = "#555";
            } else {
              // Regenerating — bar goes down from center
              fill.style.top = "50%";
              fill.style.height = pct + "%";
              fill.style.background = "#5cbd68";
            }
          }

          // Odometer
          if (car.showOdometer) {
            const odo = car.odometer;
            if (odo != null && odo > 0) {
              document.getElementById("odometer").textContent =
                Math.round(odo).toLocaleString() +
                (car.isImperial ? " mi" : " km");
              document.getElementById("bottomLeft").style.display = "flex";
            }
          } else {
            document.getElementById("bottomLeft").style.display = "none";
          }

          // Experimental mode icon
          document.getElementById("experimentalIcon").style.display =
            car.experimentalMode ? "block" : "none";

          // Steering wheel: colorize green when ADAS or MADS is active
          if (car.adasOn || car.madsActive) {
            steeringWheel.style.filter =
              "brightness(0) saturate(100%) invert(68%) sepia(52%) saturate(405%) hue-rotate(88deg) brightness(92%) contrast(87%)";
          } else {
            steeringWheel.style.filter = "";
          }

          // Rotate the steering wheel
          steeringWheel.style.transform = `rotate(${angle}deg)`;

          // Driver alerts
          const native = window.NativeCarState;
          const camDist =
            car.speedCameraDistance ?? native?.getSpeedCameraDistance?.() ?? -1;
          const isChangingLane =
            car.changingLane ?? native?.isChangingLane?.() ?? false;
          const alertEl = document.getElementById("driverAlert");
          if (isChangingLane) {
            alertEl.textContent = "Changing lane";
            alertEl.style.display = "block";
          } else if (camDist > 0) {
            alertEl.textContent = "Speed camera " + camDist + "m ahead";
            alertEl.style.display = "block";
          } else {
            alertEl.style.display = "none";
          }
        } catch (err) {
          console.error("Failed to parse message", err);
        }
      };

      window.onCarStateUpdate = function () {
        var car = {
          egoSteeringAngle: NativeCarState.getEgoSteeringAngle(),
          egoSpeed: NativeCarState.getEgoSpeed(),
          leftBlinker: NativeCarState.getLeftBlinker(),
          rightBlinker: NativeCarState.getRightBlinker(),
          gear: NativeCarState.getGear(),
          adasOn: NativeCarState.isAdasOn(),
          leftBlindSpot: NativeCarState.getLeftBlindSpot(),
          rightBlindSpot: NativeCarState.getRightBlindSpot(),
          fusedSpeedLimit: NativeCarState.getFusedSpeedLimit(),
          stopLineDist: NativeCarState.getStopLineDist(),
          trafficLightColor: NativeCarState.getTrafficLightColor(),
          buckleStatus: NativeCarState.getBuckleStatus?.() ?? undefined,
          anyDoorOpen: NativeCarState.getAnyDoorOpen?.() ?? undefined,
          accSetSpeed: NativeCarState.getAccSetSpeed?.() ?? undefined,
          odometer: NativeCarState.getOdometer?.() ?? undefined,
          phoneBattery: NativeCarState.getPhoneBattery?.() ?? undefined,
          fullPackEnergy: NativeCarState.getFullPackEnergy?.() ?? undefined,
          nominalEnergyRemaining:
            NativeCarState.getNominalEnergyRemaining?.() ?? undefined,
          energyBuffer: NativeCarState.getEnergyBuffer?.() ?? undefined,
          packTMin: NativeCarState.getPackTMin?.() ?? undefined,
          packTMax: NativeCarState.getPackTMax?.() ?? undefined,
          maxRegenPower: NativeCarState.getMaxRegenPower?.() ?? undefined,
          maxDischargePower:
            NativeCarState.getMaxDischargePower?.() ?? undefined,
          packVoltage: NativeCarState.getPackVoltage?.() ?? undefined,
          packCurrent: NativeCarState.getPackCurrent?.() ?? undefined,
          powerLevel: NativeCarState.getPowerLevel?.() ?? undefined,
          showPhoneBattery: NativeCarState.getShowPhoneBattery?.() ?? true,
          showCarBattery: NativeCarState.getShowCarBattery?.() ?? true,
          showOdometer: NativeCarState.getShowOdometer?.() ?? true,
          isImperial: NativeCarState.isImperial?.() ?? false,
          darkMode: NativeCarState.isDarkMode?.() ?? false,
          alwaysOnBlindSpotMonitor:
            NativeCarState.isAlwaysOnBlindSpotMonitor?.() ?? true,
          experimentalMode: NativeCarState.isExperimentalMode?.() ?? false,
          madsActive: NativeCarState.isMadsActive?.() ?? false,
          renderQuality: NativeCarState.getRenderQuality?.() ?? 3,
          darkModeBackgroundGray:
            NativeCarState.getDarkModeBackgroundGray?.() ?? 0,
        };
        receiveMessage(car);
      };

      window.receiveMessage = receiveMessage;

      // In a desktop browser: ?demo plays a made-up drive (add &dark=1, &gear=P|R|N|D);
      // otherwise connect to a local websocket feed like web-vanilla does.
      (function () {
        const params = new URLSearchParams(location.search);
        // ?demo=cycle: a 34 s loop. Park showing each of the cars in turn -> drive away, cycling through the
        // paints, cruise past a Cybertruck, slow for a red light that turns green and drive through it,
        // slow to a stop -> reverse a little -> Park.
        if (params.get("demo") === "cycle") {
          const SHOWCASE = 8, // s in Park at the start, split between the cars
            LOOP = 26 + SHOWCASE;
          const cars = window.CarScene.cars || [],
            paints = window.CarScene.paints || 1;
          const CAR_TIME = SHOWCASE / Math.max(cars.length, 1),
            PAINT_TIME = 20 / paints; // the drive (4-24 s on the timeline below) shows every paint
          const LIGHT_AT = 13, // s: a traffic light appears this far ahead,
            LIGHT_DIST = 70, // m
            LIGHT_GREEN = 17; // s: red until here, then green
          const ramp = (t, a, b) => {
            const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
            return x * x * (3 - 2 * x);
          };
          const t0 = performance.now();
          let lastT = 0,
            lineDist = 0; // meters to the traffic light's stop line, counted down as the car drives
          setInterval(() => {
            const r = ((performance.now() - t0) / 1000) % LOOP;
            // the timeline below runs 0-30 s with Park until 4 s; the showcase stretches that Park to SHOWCASE
            const t = r < SHOWCASE ? (r * 4) / SHOWCASE : r - SHOWCASE + 4;
            const dt = t >= lastT ? t - lastT : 0;
            lastT = t;
            let gear, speed, steer, power;
            if (t < 4) {
              // parked
              gear = 1; speed = 0; steer = 0; power = 0;
            } else if (t < 24) {
              // drive: pull away (4-9 s), cruise with gentle curves (9-12 s), slow for the red light (13-16.5 s),
              // speed back up when it turns green and drive through (17-20 s), slow to a stop (21-24 s)
              gear = 4;
              speed =
                62 * ramp(t, 4.5, 9) -
                40 * ramp(t, 13, 16.5) +
                40 * ramp(t, 17.2, 19.5);
              speed *= 1 - ramp(t, 21, 23.6);
              steer = Math.round(Math.sin((t - 4) * 0.6) * 45 * ramp(t, 6, 8) * (1 - ramp(t, 11, 13)));
              power =
                t < 9 ? 55 * (1 - ramp(t, 8, 9))
                : t < 13 ? 12
                : t < 17 ? -35
                : t < 19.5 ? 40
                : t < 21 ? 12
                : -50 * (1 - ramp(t, 23, 24));
            } else if (t < 28) {
              // reverse a few meters at walking pace, turning a little
              gear = 2;
              speed = 5 * ramp(t, 24.5, 25.5) * (1 - ramp(t, 26.8, 27.8));
              steer = -120 * ramp(t, 24.5, 25.5);
              power = speed > 0.5 ? 8 : 0;
            } else {
              // back in Park
              gear = 1; speed = 0; steer = 0; power = 0;
            }
            const driving = gear === 4 && t > 6 && t < 22;
            // the traffic light: appears LIGHT_DIST ahead, gets closer as the car drives, gone once passed
            if (t < LIGHT_AT) lineDist = LIGHT_DIST;
            else lineDist = Math.max(0, lineDist - (speed / 3.6) * dt);
            receiveMessage({
              egoSteeringAngle: steer,
              egoSpeed: Math.round(speed),
              gear,
              // left blinker and a Cybertruck in the left blind spot during the cruise
              leftBlinker: t > 9.5 && t < 12 ? (Math.floor(t * 2.5) % 2 ? 2 : 1) : 0,
              demoTrafficCar: "cybertruck",
              demoCar: cars[Math.min(Math.floor(r / CAR_TIME), cars.length - 1)],
              demoPaint: Math.min(Math.floor(Math.max(t - 4, 0) / PAINT_TIME), paints - 1),
              rightBlinker: 0,
              adasOn: driving,
              accSetSpeed: driving ? 65 : 0,
              fusedSpeedLimit: 70,
              // the warning turns urgent (2: signaling into the occupied lane) halfway through
              leftBlindSpot: t > 9 && t < 12.5 ? (t > 10.3 && t < 11.8 ? 2 : 1) : 0,
              rightBlindSpot: 0,
              stopLineDist: t >= LIGHT_AT ? lineDist : 0,
              trafficLightColor: t >= LIGHT_AT && lineDist > 0 ? (t < LIGHT_GREEN ? 1 : 2) : 0,
              phoneBattery: 76,
              showPhoneBattery: true,
              showCarBattery: true,
              showOdometer: true,
              fullPackEnergy: 75,
              nominalEnergyRemaining: 52,
              energyBuffer: 3,
              packTMin: 28,
              packTMax: 31,
              powerLevel: Math.round(power),
              maxDischargePower: 250,
              maxRegenPower: 80,
              odometer: 18452,
              darkMode: params.get("dark") === "1",
              darkModeBackgroundGray: 0,
              alwaysOnBlindSpotMonitor: true,
              buckleStatus: 1,
              renderQuality: 3,
            });
          }, 40);
          return;
        }
        if (params.has("demo")) {
          const gear = { P: 1, R: 2, N: 3, D: 4 }[params.get("gear")] || 4;
          const t0 = performance.now();
          setInterval(() => {
            const t = (performance.now() - t0) / 1000,
              cycle = t % 16;
            receiveMessage({
              egoSteeringAngle: Math.round(Math.sin(t * 0.35) * 60),
              egoSpeed: gear === 1 ? 0 : 62,
              gear,
              leftBlinker:
                cycle > 9 && cycle < 13 ? (Math.floor(t * 2.5) % 2 ? 2 : 1) : 0,
              rightBlinker: 0,
              adasOn: t % 20 > 3,
              accSetSpeed: 65,
              fusedSpeedLimit: 70,
              leftBlindSpot: cycle > 6 && cycle < 13 ? 1 : 0,
              rightBlindSpot: cycle > 2 && cycle < 5 ? 1 : 0,
              stopLineDist: Math.max(0, 110 - (t % 14) * 9),
              trafficLightColor: [2, 3, 1][Math.floor(t / 14) % 3],
              phoneBattery: 76,
              showPhoneBattery: true,
              showCarBattery: true,
              showOdometer: true,
              fullPackEnergy: 75,
              nominalEnergyRemaining: 52,
              energyBuffer: 3,
              packTMin: 28,
              packTMax: 31,
              // power bar: swings between using power (up to 70%) and regen braking (down to -60%) every ~10 s
              powerLevel:
                gear === 1 ? 0 : Math.round(Math.sin(t * 0.6) * 65 + 5),
              maxDischargePower: 250,
              maxRegenPower: 80,
              odometer: 18452,
              darkMode: params.get("dark") === "1",
              darkModeBackgroundGray: 0,
              alwaysOnBlindSpotMonitor: true,
              buckleStatus: 1,
              renderQuality: 3,
            });
          }, 40);
          return;
        }
        if (typeof NativeCarState !== "undefined") return;
        const ws = new WebSocket(
          `ws://${window.location.hostname || "localhost"}:8080`,
        );
        ws.onopen = () => console.log("WebSocket connected");
        ws.onmessage = (event) => receiveMessage(JSON.parse(event.data));
        ws.onerror = (err) => console.error("WebSocket error", err);
        ws.onclose = () => console.log("WebSocket closed");
      })();
    </script>
  </body>
</html>
