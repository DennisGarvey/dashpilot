 <path d="M207 184 C228 102 306 45 399 45 C492 45 570 102 591 184 Q592 189 588 194 L576 209 Q570 215 567 206 C544 132 482 83 399 83 C316 83 254 132 231 206 Q228 215 222 209 L210 194 Q206 189 207 184Z" fill="url(#upperRim)" stroke="#c7463c" stroke-width=".7"/>
 <path d="M243 119 Q267 116 294 117 M555 119 Q531 116 504 117" fill="none" stroke="#a32d25" stroke-width="1.2"/>
 <path d="M244 117 Q268 114 295 115 M554 117 Q530 114 503 115" fill="none" stroke="#ff8a78" stroke-opacity=".65" stroke-width=".9"/>
</g>
</svg>
