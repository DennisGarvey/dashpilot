  <path d="M370 225 Q399 215 428 225" stroke="#ff8a79" stroke-width="1.1"/>
  <path d="M374 231 Q384 226 390 230 Q394 232 399 276 Q404 232 408 230 Q414 226 424 231 L420 236 Q411 230 407 235 L399 276 L391 235 Q387 230 378 236Z" fill="#df5144" stroke="#962b22" stroke-width="1.3"/>
  <path d="M392 235 L399 273" stroke="#ff8877" stroke-width=".8"/>
 </g>
 <g id="horn-marks" fill="none" stroke="#bc4237" stroke-width=".85" opacity=".8"><path d="M321 240 Q325 244 330 241 M322 242 Q326 247 329 243"/><path d="M477 240 Q473 244 468 241 M476 242 Q472 247 469 243"/></g>
</g>
<!-- graphite hands overlay the side spokes -->
