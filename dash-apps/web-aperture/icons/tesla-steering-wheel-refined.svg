 <use href="#handShape"/><use href="#handShape" transform="translate(798 0) scale(-1 1)"/>
</g>
<g fill="none" stroke="#8c8c8c" stroke-width="1.3" stroke-linecap="round" opacity=".53">
 <path d="M201 174 Q195 174 190 183 L172 219 Q168 229 172 238 M254 190 Q260 194 260 207 L260 235 Q260 245 256 254 L242 282"/>
 <path d="M201 174 Q195 174 190 183 L172 219 Q168 229 172 238 M254 190 Q260 194 260 207 L260 235 Q260 245 256 254 L242 282" transform="translate(798 0) scale(-1 1)"/>
</g>
