<svg xmlns="http://www.w3.org/2000/svg" viewBox="154 40 490 425" role="img" aria-labelledby="title">
<title id="title">Red Tesla steering wheel with graphite hands</title>
<defs>
  <radialGradient id="upperRim" gradientUnits="userSpaceOnUse" cx="399" cy="250" r="205">
    <stop offset=".79" stop-color="#85251f"/><stop offset=".82" stop-color="#b13930"/><stop offset=".865" stop-color="#dc4b40"/><stop offset=".92" stop-color="#f66054"/><stop offset=".966" stop-color="#ff7969"/><stop offset=".99" stop-color="#ed6054"/><stop offset="1" stop-color="#ca423a"/>
  </radialGradient>
  <radialGradient id="lowerRim" gradientUnits="userSpaceOnUse" cx="399" cy="250" r="205">
    <stop offset=".8" stop-color="#963029"/><stop offset=".83" stop-color="#d64b41"/><stop offset=".875" stop-color="#ff7568"/><stop offset=".91" stop-color="#fc6559"/><stop offset=".96" stop-color="#d8473d"/><stop offset=".99" stop-color="#a92e28"/><stop offset="1" stop-color="#84251f"/>
  </radialGradient>
  <linearGradient id="spokes" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ff7365"/><stop offset=".37" stop-color="#f35c50"/><stop offset=".75" stop-color="#e34e43"/><stop offset="1" stop-color="#a82d25"/>
  </linearGradient>
