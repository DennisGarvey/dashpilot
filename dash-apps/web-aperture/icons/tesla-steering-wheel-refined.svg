  </radialGradient>
  <linearGradient id="hubEdge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff8071"/><stop offset=".35" stop-color="#dc5045"/><stop offset="1" stop-color="#942820"/></linearGradient>
  <linearGradient id="glove" x1="0" y1="0" x2=".17" y2="1"><stop stop-color="#494949"/><stop offset=".46" stop-color="#3e3e3e"/><stop offset=".76" stop-color="#343434"/><stop offset="1" stop-color="#252525"/></linearGradient>
  <linearGradient id="gloveEdge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#929292"/><stop offset=".32" stop-color="#666666"/><stop offset=".65" stop-color="#3c3c3c"/><stop offset="1" stop-color="#222222"/></linearGradient>
  <linearGradient id="button" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#9d3028"/><stop offset=".25" stop-color="#f56a5b"/><stop offset=".55" stop-color="#e65245"/><stop offset=".85" stop-color="#f46a5b"/><stop offset="1" stop-color="#a83229"/></linearGradient>
  <g id="scrollButton"><circle r="11.2" fill="#f77969"/><circle r="10" fill="url(#button)" stroke="#932820" stroke-width="1.5"/><path d="M-4 -9.2V9.2 M4 -9.2V9.2" stroke="#9c2c25" stroke-width="1.1"/><path d="M-2.8 -8V8 M5.2 -8V8" stroke="#ff8070" stroke-opacity=".65" stroke-width=".8"/></g>
  <path id="handShape" d="M204 172 C196 169 192 174 188 181 L170 217 Q165 228 169 239 L184 275 Q188 284 182 299 L163 358 Q158 370 164 375 C178 383 204 387 218 379 Q226 375 229 363 L242 300 Q244 292 251 278 L261 252 Q264 246 264 234 L263 205 Q263 189 254 186 Q246 183 238 190 L231 208 Q229 214 224 210 L207 187 Q203 180 204 172Z"/>
