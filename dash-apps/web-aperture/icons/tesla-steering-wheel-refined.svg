 <path d="M354 332 Q399 352 444 332 L431 413 Q427 433 399 433 Q371 433 367 413Z" fill="url(#lowerSpoke)" stroke="#aa3027" stroke-width="1.8"/>
 <path d="M357 340 L370 413 Q373 430 399 430 Q425 430 428 413 L441 340" fill="none" stroke="#ff7d6b" stroke-width="1.2" opacity=".8"/>
